[fish-eza]
src.git = "https://github.com/givensuman/fish-eza.git"
src.branch = "main"
fetch.github = "givensuman/fish-eza"

[fish-logo]
src.git = "https://github.com/laughedelic/fish_logo.git"
src.branch = "master"
fetch.github = "laughedelic/fish_logo"

[logseq-db]
src.github = "logseq/logseq"
fetch.url = "https://github.com/logseq/logseq/releases/download/$ver/Logseq-linux-x86_64-$ver.AppImage"
src.include_regex = "2\\.[0-9]+\\.[0-9]+$"

[logseq-md]
src.github = "logseq/logseq"
fetch.url = "https://github.com/logseq/logseq/releases/download/$ver/Logseq-linux-x86_64-$ver.AppImage"
src.include_regex = "0\\.1[0-9]*\\.[0-9]+$"

[betterbird-release]
src.httpheader = "https://www.betterbird.eu/downloads/get.php?os=linux&lang=en-US&version=release"
src.regex = 'betterbird-([0-9][^/]*)\.en-US\.linux-x86_64\.tar\.xz'
fetch.url = "https://www.betterbird.eu/downloads/LinuxArchive/betterbird-$ver.en-US.linux-x86_64.tar.xz"

[betterbird-future]
src.httpheader = "https://www.betterbird.eu/downloads/get.php?os=linux&lang=en-US&version=future"
src.regex = 'betterbird-([0-9][^/]*)\.en-US\.linux-x86_64\.tar\.xz'
fetch.url = "https://www.betterbird.eu/downloads/153-Preview/betterbird-$ver.en-US.linux-x86_64.tar.xz"
